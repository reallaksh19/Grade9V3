<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="v_A points east at 6 m/s and v_B north at 8 m/s. Reversing v_B and placing it at the head of v_A lands on v_A/B = (6, -8) m/s: what B sees A doing is east and south, at a speed neither object has." data-scene-digest="3047e3a3bdaea151717e35a1c988389f749e24a9e018ecad3c1b2f51d1b9ce0c"><title>v_A points east at 6 m/s and v_B north at 8 m/s. Reversing v_B and placing it at the head of v_A lands on v_A/B = (6, -8) m/s: what B sees A doing is east and south, at a speed neither object has.</title><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" fill="#172c42"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#135b89"/></marker></defs><line x1="234.250000" y1="180.000000" x2="325.750000" y2="180.000000" stroke="#64748b"/><line x1="234.250000" y1="302.000000" x2="234.250000" y2="58.000000" stroke="#64748b"/><text x="280.000" y="350.000" text-anchor="middle" font-size="14">east (m/s)</text><text x="10.000" y="20.000" text-anchor="start" font-size="14">north (m/s)</text><text x="224.250" y="200.000" text-anchor="middle" font-size="14">0</text><line x1="234.250000" y1="180.000000" x2="234.250000" y2="58.000000" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" data-vector="subtrahend"/><line x1="234.250000" y1="180.000000" x2="325.750000" y2="180.000000" stroke="#135b89" stroke-width="2.5" marker-end="url(#arrow)" data-vector="minuend"/><line x1="325.750000" y1="180.000000" x2="325.750000" y2="302.000000" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)" data-vector="reversed_subtrahend"/><line x1="234.250000" y1="180.000000" x2="325.750000" y2="302.000000" stroke="#166534" stroke-width="3" marker-end="url(#arrow)" data-vector="resultant"/><text x="244.250" y="113.000" text-anchor="middle" font-size="14">v_B</text><text x="290.000" y="174.000" text-anchor="middle" font-size="14">v_A</text><text x="335.750" y="235.000" text-anchor="middle" font-size="14">-v_B</text><text x="290.000" y="235.000" text-anchor="middle" font-size="14">v_A/B</text><text x="280.0" y="30" text-anchor="middle" font-size="16"><tspan font-weight="bold">v_A/B</tspan><tspan> = v_A + (-v_B) = (6, -8) m/s</tspan></text></g></svg>