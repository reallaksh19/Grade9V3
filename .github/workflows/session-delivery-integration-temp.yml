name: session delivery integration temporary refresh

on:
  push:
    branches:
      - integration/study-session-delivery-resolver

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/study-session-delivery-resolver
          fetch-depth: 0
      - run: rm .github/workflows/session-delivery-integration-temp.yml
      - run: python3 Shared/tools/build_manifest.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json tools/data.js .github/workflows/session-delivery-integration-temp.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate session delivery integration artifacts"
          git push origin HEAD:integration/study-session-delivery-resolver
