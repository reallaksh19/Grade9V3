name: final acceptance boundary temporary artifact refresh

on:
  push:
    branches:
      - integration/self-study-v1-candidate

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/self-study-v1-candidate
          fetch-depth: 0
      - run: rm .github/workflows/final-acceptance-boundary-temp.yml
      - run: python3 Shared/tools/build_manifest.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json tools/data.js .github/workflows/final-acceptance-boundary-temp.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate final acceptance-boundary artifacts"
          git push origin HEAD:integration/self-study-v1-candidate
