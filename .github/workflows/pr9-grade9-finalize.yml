name: pr9-grade9-finalize

on:
  push:
    branches: ["fix/p0-plan-compiler-agreement"]

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet jsonschema

      - name: Model final tree without this one-shot workflow
        run: git rm .github/workflows/pr9-grade9-finalize.yml

      - name: Refresh committed publication runtimes
        run: python3 Shared/tools/republish.py --write

      - name: Regenerate derived artifacts
        run: python3 Shared/tools/build_manifest.py

      - name: Topic independence
        run: |
          python3 Shared/tools/topic_independence_guard.py --selftest
          python3 Shared/tools/topic_independence_guard.py

      - name: Role specs
        run: python3 Shared/tools/spec_conformance.py --enforce

      - name: Learner evidence
        run: python3 Shared/tools/learner_evidence.py --enforce

      - name: Matrix conformance
        run: python3 Shared/tools/matrix_conformance.py --enforce

      - name: Request resolution
        run: python3 Shared/tools/resolve_request.py --enforce

      - name: Practice readiness
        run: python3 Shared/tools/practice_readiness.py --enforce

      - name: Engineering readiness
        run: python3 Shared/tools/engineering_readiness.py --enforce

      - name: Ceiling audit
        run: python3 Shared/tools/ceiling_audit.py --enforce

      - name: Publication provenance
        run: python3 Shared/tools/publication_provenance.py --enforce

      - name: Publication verification
        run: python3 Shared/tools/republish.py --check

      - name: Representation authority
        run: python3 Shared/library/depiction.py --enforce

      - name: Compiler delivery
        run: python3 Shared/tools/compile_delivery.py --enforce

      - name: Subject sweep
        run: python3 Shared/tools/check_subjects.py

      - name: Contract implementation
        run: python3 Shared/tools/contract_implementation.py --enforce

      - name: Generated artifacts check
        run: python3 Shared/tools/build_manifest.py --check

      - name: Full test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: All JSON parses
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          PY

      - name: Commit tested Grade 9 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Grade 9 Physics spine"
          git push origin HEAD:fix/p0-plan-compiler-agreement

      - name: Dispatch final guardrails
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run guardrails.yml --ref fix/p0-plan-compiler-agreement
