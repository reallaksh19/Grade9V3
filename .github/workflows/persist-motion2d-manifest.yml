name: persist Motion2D hardening manifest

on:
  push:
    branches:
      - tmp/g9-pinnacle-motion2d-manifest

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet jsonschema
      - name: Generate repository-native artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json
          if git diff --cached --quiet; then
            echo "manifest already current"
            exit 0
          fi
          git commit -m "CI helper: persist Motion2D hardening manifest"
          git push origin HEAD:"${GITHUB_REF_NAME}"
