name: application context schema temporary artifact refresh

on:
  push:
    branches:
      - architecture/application-context-schema

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/application-context-schema
          fetch-depth: 0
      - run: rm .github/workflows/application-context-schema-temp.yml
      - run: python3 Shared/tools/build_manifest.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json tools/data.js .github/workflows/application-context-schema-temp.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate application-context schema artifacts"
          git push origin HEAD:architecture/application-context-schema
