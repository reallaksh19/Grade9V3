name: pr9-regenerate-and-test

on:
  push:
    branches: ["fix/p0-plan-compiler-agreement"]

permissions:
  contents: read

jobs:
  regenerate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet jsonschema

      - name: Model the final tree without this one-shot workflow
        run: git rm .github/workflows/pr9-regenerate.yml

      - name: Regenerate derived artifacts
        run: python3 Shared/tools/build_manifest.py

      - name: Practice readiness
        run: python3 Shared/tools/practice_readiness.py --enforce

      - name: Full test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Generated artifacts check
        run: python3 Shared/tools/build_manifest.py --check

      - uses: actions/upload-artifact@v4
        with:
          name: pr9-generated
          path: |
            docs/architecture-manifest.json
            tools/data.js
          if-no-files-found: error
