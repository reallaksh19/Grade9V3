name: issue19-refresh-generated-manifest-data

on:
  pull_request:
    branches:
      - architecture/final-release-authority

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'content/issue-19-physics-math-matrices'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/issue-19-physics-math-matrices
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate and commit architecture explorer data
        run: |
          python3 Shared/tools/build_manifest.py
          git checkout -- docs/architecture-manifest.json
          if git diff --quiet -- tools/data.js; then
            echo "tools/data.js already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data.js
          git commit -m "Regenerate architecture explorer data for Issue 19"
          git push origin HEAD:content/issue-19-physics-math-matrices
