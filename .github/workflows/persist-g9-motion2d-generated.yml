name: persist G9 Motion2D generated artifacts

on:
  push:
    branches:
      - tmp/g9-motion2d-examside-generated

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet jsonschema
      - name: Generate repository-native artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data.js docs/architecture-manifest.json
          if git diff --cached --quiet; then
            echo "generated artifacts already current"
            exit 0
          fi
          git commit -m "CI helper: persist G9 Motion2D generated artifacts"
          git push origin HEAD:"${GITHUB_REF_NAME}"
