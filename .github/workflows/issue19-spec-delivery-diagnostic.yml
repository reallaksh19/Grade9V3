name: issue19-spec-delivery-diagnostic

on:
  pull_request:
    branches:
      - architecture/final-release-authority

jobs:
  diagnose:
    if: github.head_ref == 'content/issue-19-physics-math-matrices'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Full spec delivery report
        run: python3 Shared/tools/spec_delivery.py
