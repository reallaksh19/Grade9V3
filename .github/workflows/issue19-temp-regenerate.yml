name: issue19 temporary generated-artifact refresh

on:
  push:
    branches:
      - content/issue-19-physics-math-matrices

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/issue-19-physics-math-matrices
          fetch-depth: 0

      - name: Remove this temporary workflow before generation
        run: rm .github/workflows/issue19-temp-regenerate.yml

      - name: Regenerate committed derived artifacts
        run: python3 Shared/tools/build_manifest.py

      - name: Commit refreshed artifacts and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json tools/data.js .github/workflows/issue19-temp-regenerate.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate Issue 19 derived artifacts"
          git push origin HEAD:content/issue-19-physics-math-matrices
