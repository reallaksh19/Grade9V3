name: river source audit temporary artifact refresh

on:
  push:
    branches:
      - content/relative-motion-moving-medium

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/relative-motion-moving-medium
          fetch-depth: 0
      - run: rm .github/workflows/river-source-audit-temp.yml
      - run: python3 Shared/tools/build_manifest.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json tools/data.js .github/workflows/river-source-audit-temp.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate river source audit artifacts"
          git push origin HEAD:content/relative-motion-moving-medium
