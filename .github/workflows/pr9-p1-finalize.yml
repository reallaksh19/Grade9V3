name: pr9-p1-finalize

on:
  push:
    branches: ["fix/p0-plan-compiler-agreement"]

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet jsonschema

      - name: Model final tree without this one-shot workflow
        run: git rm .github/workflows/pr9-p1-finalize.yml

      - name: Refresh committed publication runtimes
        run: python3 Shared/tools/republish.py --write

      - name: Regenerate derived artifacts
        run: python3 Shared/tools/build_manifest.py

      - name: Practice readiness
        run: python3 Shared/tools/practice_readiness.py --enforce

      - name: Subject sweep
        run: python3 Shared/tools/check_subjects.py

      - name: Representation authority
        run: python3 Shared/library/depiction.py --enforce

      - name: Full test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Generated artifacts check
        run: python3 Shared/tools/build_manifest.py --check

      - name: Commit tested final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize P1 practice custody artifacts"
          git push origin HEAD:fix/p0-plan-compiler-agreement

      - name: Dispatch final guardrails
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run guardrails.yml --ref fix/p0-plan-compiler-agreement
