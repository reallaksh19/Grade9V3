name: regenerate-worksheet-study-view-preview

on:
  push:
    branches:
      - feat/worksheet-study-plan-detailed-view

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worksheet-study-plan-detailed-view
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate architecture manifest
        run: python3 Shared/tools/build_manifest.py
      - name: Commit regenerated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build: refresh worksheet study view manifest"
            git push origin HEAD:feat/worksheet-study-plan-detailed-view
          fi
