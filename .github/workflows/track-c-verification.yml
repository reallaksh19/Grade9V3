name: track-c-regenerate
on:
  push:
    branches: ["p0-foundations"]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-foundations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: pip install --quiet jsonschema
      - name: Regenerate indexes
        run: python3 Shared/tools/build_manifest.py
      - name: Commit deterministic generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data.js docs/architecture-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate indexes after Physics rung authoring"
          git push origin HEAD:p0-foundations
