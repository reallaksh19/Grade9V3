name: regenerate-motion2d-agent-a-preview

on:
  push:
    branches:
      - agent-a/motion2d-topic-atlas

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-a/motion2d-topic-atlas
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate existing projections
        run: |
          python3 Shared/tools/build_web_data.py
          python3 Shared/tools/build_manifest.py
      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data.js docs/architecture-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build: refresh Motion in 2D projections"
            git push origin HEAD:agent-a/motion2d-topic-atlas
          fi
