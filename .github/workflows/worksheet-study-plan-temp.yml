name: worksheet study plan temporary artifact refresh

on:
  push:
    branches:
      - core/worksheet-study-plan-view

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/worksheet-study-plan-view
          fetch-depth: 0

      - name: Remove temporary workflow before generation
        run: rm .github/workflows/worksheet-study-plan-temp.yml

      - name: Regenerate committed derived artifacts
        run: python3 Shared/tools/build_manifest.py

      - name: Commit refreshed artifacts and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json tools/data.js .github/workflows/worksheet-study-plan-temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate worksheet study plan artifacts"
          git push origin HEAD:core/worksheet-study-plan-view
