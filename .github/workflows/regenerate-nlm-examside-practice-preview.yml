name: regenerate-nlm-examside-practice-preview

on:
  push:
    branches:
      - feat/g9-nlm-examside-practice-acceptance

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/g9-nlm-examside-practice-acceptance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate shipped data and manifest
        run: |
          python3 Shared/tools/build_web_data.py
          python3 Shared/tools/build_manifest.py
      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data.js docs/architecture-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build: refresh ExamSIDE NLM practice artifacts"
            git push origin HEAD:feat/g9-nlm-examside-practice-acceptance
          fi
