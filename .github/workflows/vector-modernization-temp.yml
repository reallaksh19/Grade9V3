name: vector modernization temporary artifact refresh

on:
  push:
    branches:
      - content/vector-foundations-modernization

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/vector-foundations-modernization
          fetch-depth: 0
      - run: rm .github/workflows/vector-modernization-temp.yml
      - run: python3 Shared/tools/build_manifest.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json tools/data.js .github/workflows/vector-modernization-temp.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate vector modernization artifacts after rebase"
          git push origin HEAD:content/vector-foundations-modernization
