name: tmp-agent-a-finalize-generated-artifacts

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet jsonschema
      - name: Regenerate canonical artifacts and remove temporary workflow
        run: |
          rm .github/workflows/tmp-agent-a-finalize-generated-artifacts.yml
          python3 Shared/tools/build_manifest.py
      - name: Commit canonical generated artifacts
        run: |
          git config user.name "agent-a-ci"
          git config user.email "agent-a-ci@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Refresh manifest after Motion1D regression fixes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
