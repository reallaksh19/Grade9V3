name: Track B Validation
on:
  push:
    branches: [track-b-validation]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet jsonschema
      - name: Intake Track B packages
        run: |
          for slug in phy-rot-rigid-body phy-grav-universal-law phy-fluid-bernoulli-equation phy-thermo-first-second-law; do
            python3 Shared/library/intake.py "Physics/library/$slug.v1.json"
          done
      - name: Matrix and ceiling contracts
        run: |
          python3 Shared/tools/matrix_conformance.py --enforce
          python3 Shared/tools/ceiling_audit.py --enforce
          python3 Shared/tools/resolve_request.py --enforce
      - name: Authored rungs bind
        run: |
          set -e
          check () {
            python3 Shared/tools/author_brief.py --subject Physics --bucket "$1" --rung "$2" --core CORE1A | grep -q "## Bind to $3"
          }
          check BUCKET-PHY-ROT-RIGID-BODY R1 MIC-PHY-ROT-R1
          check BUCKET-PHY-ROT-RIGID-BODY R3 MIC-PHY-ROT-R3
          check BUCKET-PHY-ROT-RIGID-BODY R4 MIC-PHY-ROT-R4
          check BUCKET-PHY-ROT-RIGID-BODY R5 MIC-PHY-ROT-R5
          check BUCKET-PHY-GRAV-UNIVERSAL-LAW R1 MIC-PHY-GRAV-R1
          check BUCKET-PHY-GRAV-UNIVERSAL-LAW R4 MIC-PHY-GRAV-R4
          check BUCKET-PHY-GRAV-UNIVERSAL-LAW R5 MIC-PHY-GRAV-R5
          check BUCKET-PHY-FLUID-BERNOULLI-EQUATION R2 MIC-PHY-FLUID-R2
          check BUCKET-PHY-FLUID-BERNOULLI-EQUATION R3 MIC-PHY-FLUID-R3
          check BUCKET-PHY-FLUID-BERNOULLI-EQUATION R4 MIC-PHY-FLUID-R4
          check BUCKET-PHY-THERMO-FIRST-SECOND-LAW R1 MIC-PHY-THERMO-R1
          check BUCKET-PHY-THERMO-FIRST-SECOND-LAW R3 MIC-PHY-THERMO-R3
          check BUCKET-PHY-THERMO-FIRST-SECOND-LAW R4 MIC-PHY-THERMO-R4
          check BUCKET-PHY-THERMO-FIRST-SECOND-LAW R5 MIC-PHY-THERMO-R5
      - name: Subject sweep report
        run: |
          python3 Shared/tools/check_subjects.py > /tmp/subjects.json || true
          cat /tmp/subjects.json
          python3 - <<'PY'
          import json
          report=json.load(open("/tmp/subjects.json"))
          ours=("phy-rot-rigid-body.v1.json","phy-grav-universal-law.v1.json","phy-fluid-bernoulli-equation.v1.json","phy-thermo-first-second-law.v1.json",
                "BUCKET-PHY-ROT-RIGID-BODY","BUCKET-PHY-GRAV-UNIVERSAL-LAW","BUCKET-PHY-FLUID-BERNOULLI-EQUATION","BUCKET-PHY-THERMO-FIRST-SECOND-LAW",
                "CAP-PHY-ROT","CAP-PHY-GRAV","CAP-PHY-FLUID","CAP-PHY-THERMO","MIC-PHY-ROT","MIC-PHY-GRAV","MIC-PHY-FLUID","MIC-PHY-THERMO")
          bad=[]
          for subject in report["subjects"]:
            for finding in subject["findings"]:
              if any(x in finding for x in ours) and "BUCKET_PRIMARY_REPRESENTATION_UNDECLARED" not in finding:
                bad.append(finding)
          if bad:
            raise SystemExit("Track B subject findings:\n" + "\n".join(bad))
          PY
      - name: Capability collisions report
        run: python3 Shared/tools/capability_collisions.py
