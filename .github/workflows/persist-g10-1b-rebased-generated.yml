name: persist-g10-1b-rebased-generated

on:
  push:
    branches:
      - tmp/g10-1b-rebase-current-main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/g10-1b-rebase-current-main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate derived artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Persist changed generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json tools/data.js
          if git diff --cached --quiet; then
            echo "generated artifacts already current"
            exit 0
          fi
          git commit -m "Build: refresh G10-1B generated artifacts"
          git push origin HEAD:tmp/g10-1b-rebase-current-main
