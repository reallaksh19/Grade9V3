name: tmp-agent-a-export-web-data

on:
  push:
    branches:
      - agent-a/motion1d-vertical-gravity-integration

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet jsonschema
      - run: python3 Shared/tools/build_web_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: generated-web-data
          path: tools/data.js
