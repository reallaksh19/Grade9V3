name: TEMP render generated artifacts

on:
  push:
    branches:
      - g10-1a/reflection-mirrors-core
    paths:
      - .github/workflows/temp-render-generated.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g10-1a/reflection-mirrors-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet jsonschema
      - name: Regenerate shipped data and manifest
        run: |
          python3 Shared/tools/build_web_data.py
          python3 Shared/tools/build_manifest.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data.js docs/architecture-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: regenerate web data and architecture manifest"
            git push origin HEAD:g10-1a/reflection-mirrors-core
          fi
