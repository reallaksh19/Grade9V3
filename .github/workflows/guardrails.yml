name: guardrails

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Proves the guard detects a planted violation. Without this a guard that
      # scanned nothing would pass vacuously.
      - name: Topic independence guard — self-test
        run: python3 Shared/tools/topic_independence_guard.py --selftest

      - name: Topic independence guard — scan Shared/
        run: python3 Shared/tools/topic_independence_guard.py

      - name: Subject contracts parse and declare all six learner products
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          required = {"CORE1", "CORE2", "CORE1A", "CORE1B", "CORE2A", "CORE2B"}
          failures = []
          contracts = sorted(Path(".").glob("*/adapter/CoreContracts.json"))
          if not contracts:
              sys.exit("no subject contracts found")
          for path in contracts:
              data = json.loads(path.read_text(encoding="utf-8"))
              products = set(data.get("learner_products", {}))
              if products != required:
                  failures.append(f"{path}: learner_products {sorted(products)} != {sorted(required)}")
              for entry in data.get("validator_catalogue", []):
                  if "result" not in entry or "comparison" not in entry.get("result", {}):
                      failures.append(f"{path}: validator {entry.get('id')} declares no result comparison")
                  if not str(entry.get("does_not_prove", "")).strip():
                      failures.append(f"{path}: validator {entry.get('id')} declares no does_not_prove limit")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print(f"{len(contracts)} subject contract(s) checked: six learner products, "
                f"declared comparisons and declared limits present.")
          PY

      - name: All JSON parses
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          bad = []
          for path in sorted(Path(".").rglob("*.json")):
              if ".git" in path.parts:
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all JSON documents parse")
          PY
