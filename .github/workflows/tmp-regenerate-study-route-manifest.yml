name: temporary regenerate architecture manifest

on:
  push:
    branches:
      - core/cross-matrix-study-route

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/cross-matrix-study-route
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 Shared/tools/build_manifest.py
      - name: Commit generated files if changed
        run: |
          if git diff --quiet -- docs/architecture-manifest.json tools/data.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json tools/data.js
          git commit -m "Regenerate architecture manifest"
          git push
